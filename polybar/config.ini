[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880


[bar/mybar]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.primary}

font-0 = "JetBrainsMono NF:style=Regular:size=12;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
font-2 = "JetBrainsMono Nerd Font:size=18;3"

modules-left = distro xworkspaces
modules-right =  vol memory cpu battery wlan
#the modules-right had "filesystem", "xkeyboard"
modules-center = date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
 wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰌢  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
format-font = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-font = 2

[network-base]
type = internal/network
interval = 60
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}󰤨 %{F-}  
format-font = 2

[module/date]
type = internal/date
interval = 60

date = %d %b | %I:%M %p
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/vol]
type = custom/script
# The path to your bash script
exec = ~/.config/polybar/scripts/vol.sh

# Optional: format styles
format-foreground = #F0C674
tail = true
#polybar's native click functions
click-left = blueman-manager &
format-font = 2

[module/battery]
type = custom/script
# The path to your bash script
exec = ~/.config/polybar/scripts/battery.sh

# How often to rerun the script (in seconds)
interval = 30
# Optional: format styles
format-foreground = #F0C674
format-font = 2

[module/distro]
type = custom/text
format = "  "
format-foreground = ${colors.primary}
format-font = 3
interval = 0
