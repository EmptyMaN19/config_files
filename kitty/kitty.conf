# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size  15.0

#cursor_shape in itself wasn't helping at all due the intervention of the shell, thus had to disbale it
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0

#this is for opacity
background_opacity 0.6
dynamic_background_opacity yes

#to hide mouse while typing on the terminal
mouse_hide_wait -3.0

#this is for tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

#disable bell sound
enable_audio_bell no

#audio bell
window_alert_on_bell yes
visual_bell_duration 0.1 ease-in linear
visual_bell_color #3D3255
